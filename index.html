<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>SHADOW FRACTAL CAMERA</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:monospace;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  pointer-events:none;
}
#hud{
  position:fixed;
  top:18px;
  left:18px;
  color:#fff;
  font-size:12px;
  line-height:1.6;
  letter-spacing:.12em;
  z-index:90;
  opacity:.82;
  text-shadow:0 0 8px rgba(0,0,0,.9);
  pointer-events:none;
}
#hud .group{
  margin-bottom:22px;
}
#hud .title{
  margin-bottom:10px;
  opacity:.45;
  font-size:10px;
}
#capture{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  width:74px;
  height:74px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.82);
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  z-index:999;
}
#capture:active{
  transform:translateX(-50%) scale(.94);
}
/* 계약서 버튼 */
#contractBtn{
  position:fixed;
  top:18px;
  right:18px;
  z-index:999;
  background:rgba(0,0,0,.38);
  border:1px solid rgba(255,255,255,.35);
  color:rgba(255,255,255,.82);
  font-family:monospace;
  font-size:9px;
  letter-spacing:.2em;
  padding:8px 13px;
  cursor:pointer;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:all .18s;
  line-height:1.5;
  text-align:center;
}
#contractBtn:hover, #contractBtn:active{
  background:rgba(255,255,255,.15);
  border-color:rgba(255,255,255,.7);
}
#start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  color:#fff;
  z-index:9999;
  font-size:14px;
  letter-spacing:.12em;
}
</style>
</head>
<body>

<div id="start">TAP TO START CAMERA</div>

<canvas id="gl"></canvas>
<video
  id="cam"
  autoplay
  muted
  playsinline
  webkit-playsinline
  x5-playsinline
  x-webkit-airplay="allow"
></video>

<div id="hud">
  <div class="group">
    <div class="title">SHADOW DATA</div>
    <div id="timeTxt"></div>
    <div id="dateTxt"></div>
    <div id="latTxt"></div>
    <div id="lngTxt"></div>
  </div>
  <div class="group">
    <div class="title">FRACTAL ITERATION</div>
    <div id="cTxt"></div>
    <div id="zoomTxt"></div>
  </div>
</div>

<!-- 계약서 버튼 -->
<button id="contractBtn" onclick="window.open('contract.html','_blank')">
  AGENT<br>CONTRACT
</button>

<button id="capture"></button>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', {
  alpha: false,
  antialias: true,
  preserveDrawingBuffer: true
});

const VS = `
attribute vec2 a;
void main(){
  gl_Position = vec4(a, 0., 1.);
}
`;

const FS = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_c;
uniform vec2 u_ctr;
uniform float u_zoom;
uniform sampler2D u_bg;

vec2 cmul(vec2 a, vec2 b){
  return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - u_res*.5) / min(u_res.x, u_res.y);
  vec2 bg_uv = vec2(gl_FragCoord.x/u_res.x, gl_FragCoord.y/u_res.y);
  vec3 cam = texture2D(u_bg, bg_uv).rgb;

  float lum = dot(cam, vec3(0.299, 0.587, 0.114));
  float exposure = mix(0.35, 1.7, 1.0 - lum);
  cam *= exposure;
  cam = pow(cam, vec3(1.3));
  float mono = dot(cam, vec3(.333));
  cam = mix(vec3(mono), cam, 0.08);

  vec2 z = uv * u_zoom + u_ctr;
  vec2 c = u_c + vec2(sin(u_time*.0004)*0.08, cos(u_time*.0003)*0.08);

  float glow = 0.0;
  float rings = 0.0;
  vec2 p = z;
  for(int i = 0; i < 220; i++){
    p = cmul(p, p) + c;
    float r = length(p);
    glow += 0.006 / max(r, 0.03);
    rings += exp(-10.0 * abs(sin(r*5.0 - u_time*.0004)));
    if(r > 8.0) break;
  }
  glow = pow(glow, 1.28);
  rings *= 0.022;

  vec3 fractal = vec3(glow*2.4) + vec3(rings);
  vec3 col = cam*0.76 + fractal*2.4;
  col += fractal * smoothstep(0.08, 1.2, glow) * 1.8;
  col = col / (col + vec3(.7));
  gl_FragColor = vec4(col, 1.);
}
`;

function mk(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, mk(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),
  gl.STATIC_DRAW
);

const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = {
  res:  gl.getUniformLocation(prog, 'u_res'),
  time: gl.getUniformLocation(prog, 'u_time'),
  c:    gl.getUniformLocation(prog, 'u_c'),
  ctr:  gl.getUniformLocation(prog, 'u_ctr'),
  zoom: gl.getUniformLocation(prog, 'u_zoom'),
  bg:   gl.getUniformLocation(prog, 'u_bg')
};

const S = {
  zoom: 2.6,
  ctr: { x: 0, y: 0 },
  c:   { x: 0, y: 0 }
};

function resize(){
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
addEventListener('resize', resize);

const cam = document.getElementById('cam');
let tex = null;

const offscreen = document.createElement('canvas');
const ctx2d     = offscreen.getContext('2d');

async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width:     { ideal: 1920 },
      height:    { ideal: 1080 },
      frameRate: { ideal: 30, max: 60 }
    },
    audio: false
  });

  cam.srcObject = stream;
  await new Promise(r => { cam.onloadedmetadata = r; });
  await cam.play();

  offscreen.width  = cam.videoWidth  || 1280;
  offscreen.height = cam.videoHeight || 720;

  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(
    gl.TEXTURE_2D, 0, gl.RGBA,
    1, 1, 0,
    gl.RGBA, gl.UNSIGNED_BYTE,
    new Uint8Array([0,0,0,255])
  );
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  setInterval(() => {
    if(cam.paused) cam.play();
  }, 1000);

  document.getElementById('start').style.display = 'none';
}

document.getElementById('start').onclick = () => { startCamera(); };

function coordsToC(lat, lng){
  const latF = ((lat % 1) + 1) % 1;
  const lngF = ((lng % 1) + 1) % 1;
  const k = 1500;
  return {
    x: (Math.sin(latF * k)        * 0.6 + Math.cos(lngF * k * 0.73)) * 0.55,
    y: (Math.sin(lngF * k * 1.13) * 0.6 - Math.cos(latF * k * 0.91)) * 0.55
  };
}

let currentLat = 0;
let currentLng = 0;
navigator.geolocation.watchPosition(pos => {
  currentLat = pos.coords.latitude;
  currentLng = pos.coords.longitude;
  S.c = coordsToC(currentLat, currentLng);
});

function updateHUD(){
  const d = new Date();
  document.getElementById('timeTxt').textContent =
    'TIME: ' + d.toLocaleTimeString('en-GB', { hour12: false });
  document.getElementById('dateTxt').textContent =
    'DATE: ' + d.toISOString().slice(0, 10);
  document.getElementById('latTxt').textContent =
    'LAT: ' + currentLat.toFixed(7);
  document.getElementById('lngTxt').textContent =
    'LNG: ' + currentLng.toFixed(7);
  document.getElementById('cTxt').textContent =
    'c = ' + S.c.x.toFixed(5) + '+' + S.c.y.toFixed(5) + 'i';
  document.getElementById('zoomTxt').textContent =
    'ZOOM: ' + S.zoom.toFixed(2);
}

function loop(t){
  gl.uniform2f(U.res,  canvas.width, canvas.height);
  gl.uniform1f(U.time, t);
  gl.uniform2f(U.c,    S.c.x,   S.c.y);
  gl.uniform2f(U.ctr,  S.ctr.x, S.ctr.y);
  gl.uniform1f(U.zoom, S.zoom);

  if(tex && cam.readyState >= cam.HAVE_CURRENT_DATA){
    const vw = cam.videoWidth;
    const vh = cam.videoHeight;
    if(vw > 0 && vh > 0){
      if(offscreen.width !== vw || offscreen.height !== vh){
        offscreen.width  = vw;
        offscreen.height = vh;
      }
      ctx2d.drawImage(cam, 0, 0, vw, vh);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(
        gl.TEXTURE_2D, 0,
        gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE,
        offscreen
      );
      gl.uniform1i(U.bg, 0);
    }
  }

  updateHUD();
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

// pinch zoom
let drag = false;
let lx = 0, ly = 0;
let pinchDist = 0, pinchZoom = 1;

canvas.addEventListener('touchstart', e => {
  if(e.touches.length === 1){
    drag = true;
    lx = e.touches[0].clientX;
    ly = e.touches[0].clientY;
  }
  if(e.touches.length === 2){
    pinchDist = distTouches(e.touches);
    pinchZoom = S.zoom;
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if(drag && e.touches.length === 1){
    S.ctr.x -= (e.touches[0].clientX - lx) / innerHeight * S.zoom;
    S.ctr.y += (e.touches[0].clientY - ly) / innerHeight * S.zoom;
    lx = e.touches[0].clientX;
    ly = e.touches[0].clientY;
  }
  if(e.touches.length === 2){
    const d = distTouches(e.touches);
    S.zoom = Math.max(0.18, Math.min(22, pinchZoom * (pinchDist / d)));
  }
}, { passive: true });

canvas.addEventListener('touchend', () => { drag = false; });

function distTouches(t){
  const dx = t[0].clientX - t[1].clientX;
  const dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function buildCaptureCanvas(){
  const comp = document.createElement('canvas');
  comp.width  = canvas.width;
  comp.height = canvas.height;
  const ctx = comp.getContext('2d');
  ctx.drawImage(canvas, 0, 0);
  ctx.shadowColor = 'rgba(0,0,0,0.92)';
  ctx.shadowBlur  = 9;
  ctx.textBaseline = 'top';
  const d = new Date();
  const sections = [
    { label: 'SHADOW DATA', rows: [
      'TIME: ' + d.toLocaleTimeString('en-GB', { hour12: false }),
      'DATE: ' + d.toISOString().slice(0, 10),
      'LAT: '  + currentLat.toFixed(7),
      'LNG: '  + currentLng.toFixed(7),
    ]},
    { label: 'FRACTAL ITERATION', rows: [
      'c = ' + S.c.x.toFixed(5) + '+' + S.c.y.toFixed(5) + 'i',
      'ZOOM: ' + S.zoom.toFixed(2),
    ]},
  ];
  let y = 18;
  sections.forEach(sec => {
    ctx.font         = '11px monospace';
    ctx.fillStyle    = 'rgba(255,255,255,0.42)';
    ctx.fillText(sec.label, 18, y);
    y += 17;
    ctx.font      = '13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    sec.rows.forEach(row => {
      ctx.fillText(row, 18, y);
      y += 20;
    });
    y += 14;
  });
  return comp;
}

document.getElementById('capture').onclick = () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const comp = buildCaptureCanvas();
      comp.toBlob(async blob => {
        const filename = 'shadow-fractal-' + Date.now() + '.png';
        const file = new File([blob], filename, { type: 'image/png' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Shadow Fractal' });
            return;
          } catch (e) {
            if (e.name === 'AbortError') return;
          }
        }
        const url = URL.createObjectURL(blob);
        const a   = document.createElement('a');
        a.href     = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    });
  });
};
</script>
</body>
</html>
